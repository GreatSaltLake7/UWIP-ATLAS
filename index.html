<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UWIP Atlas — Utah Water Innovation Platform</title>
<style>
:root{
  --deep:#0B3B45; --teal:#17786F; --shallow:#7FB0A0; --salt:#E4E3D8; --sand:#D9A15C; --rust:#B4491F;
  --paper:#F3F5F3; --panel:#FFFFFF; --rail:#0E2831;
  --ink:#0E2831; --ink2:#4A6068; --ink3:#8A9793; --line:#CBD4D2;
  --display:Cambria,"Palatino Linotype",Palatino,Georgia,serif;
  --ui:"Segoe UI",Calibri,system-ui,-apple-system,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rw:228px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
a{color:var(--teal)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
aside{width:var(--rw);flex:none;background:var(--rail);color:#DCE6E3;position:sticky;top:0;height:100vh;
  overflow-y:auto;padding:0 0 28px}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .mark{height:5px;width:44px;border-radius:2px;margin-bottom:12px;
  background:linear-gradient(90deg,var(--deep),var(--teal) 30%,var(--salt) 62%,var(--rust))}
.brand b{font-family:var(--display);font-size:19px;color:#fff;display:block;letter-spacing:-.01em}
.brand span{font-family:var(--num);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#7E9C96;display:block;margin-top:5px}
nav{padding:14px 0}
nav .grp{font-family:var(--num);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#6B8A84;
  padding:14px 20px 6px}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:#C3D4D0;
  font-family:var(--ui);font-size:13.5px;padding:7px 20px;cursor:pointer;border-left:3px solid transparent}
nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav button[aria-current=true]{color:#fff;background:rgba(23,120,111,.28);border-left-color:var(--teal);font-weight:600}
nav button:focus-visible{outline:2px solid var(--sand);outline-offset:-2px}
nav .n{font-family:var(--num);font-size:10.5px;color:#6B8A84;float:right;margin-top:2px}

main{flex:1;min-width:0;padding:30px 34px 70px;max-width:1360px}
.view{display:none}.view.on{display:block}
.vhead{margin-bottom:20px;max-width:88ch}
.eyebrow{font-family:var(--num);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.vhead h2{font-size:25px;margin-bottom:6px}
.vhead p{color:var(--ink2);margin:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:16px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{flex-direction:column}
  aside{width:100%;height:auto;position:static}
  nav{display:flex;flex-wrap:wrap;padding:8px 12px}
  nav .grp{display:none}
  nav button{width:auto;border-left:none;border-bottom:3px solid transparent;padding:7px 12px}
  nav button[aria-current=true]{border-left:none;border-bottom-color:var(--teal)}
  main{padding:20px 16px 50px}
}

/* ---------- controls ---------- */
.ctrls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctrl{display:flex;align-items:center;gap:7px}
.ctrl>span{font-family:var(--num);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font-family:var(--ui);font-size:12.5px;padding:5px 11px;border:none;background:none;color:var(--ink2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--deep);color:#fff;font-weight:600}
.seg button:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
input[type=search],select{font-family:var(--ui);font-size:13px;padding:6px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink);min-width:190px}
label.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);cursor:pointer}
.btn{font-family:var(--ui);font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--ink2);cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--ink3)}

/* ---------- heat grid ---------- */
.hm{width:100%;border-collapse:separate;border-spacing:2px;min-width:640px}
.hm th{font-weight:600;font-size:11.5px;color:var(--ink2);padding:5px 4px;vertical-align:bottom;text-align:center}
.hm th.rowh{text-align:right;color:var(--ink);font-size:12.5px;padding-right:10px;white-space:nowrap;width:1%}
.hm td{padding:0}
.cell{width:100%;height:54px;border:none;border-radius:3px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-family:var(--ui);font-size:11px;line-height:1.15;text-align:center;padding:3px;
  transition:transform .1s,box-shadow .1s}
.cell:hover{transform:scale(1.05);z-index:5;box-shadow:0 3px 12px rgba(11,59,69,.3)}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:1px;z-index:6}
.cell.dim{opacity:.22}
.cell b{font-family:var(--num);font-size:15px;font-weight:700;display:block}
.marg{background:none!important;color:var(--ink2);font-family:var(--num);font-size:12px;cursor:default}
.marg:hover{transform:none;box-shadow:none}
.legend{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.ramp{height:10px;width:220px;border-radius:2px;
  background:linear-gradient(90deg,var(--deep),var(--teal),var(--shallow),var(--salt),var(--sand),var(--rust))}
.ramp.rev{background:linear-gradient(90deg,var(--rust),var(--sand),var(--salt),var(--shallow),var(--teal),var(--deep))}
.legend small{color:var(--ink2);font-size:11.5px}

/* ---------- side panel ---------- */
.side h3{font-size:16px;margin-bottom:3px}
.side .kicker{font-family:var(--num);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.side .empty{color:var(--ink2);font-style:italic;font-size:13px}
.plist{list-style:none;margin:10px 0 0;padding:0;max-height:440px;overflow:auto}
.plist li{border-top:1px solid var(--line);padding:9px 0}
.plist b{font-size:13px;display:block}
.plist span{color:var(--ink2);font-size:12px;display:block}
.stat{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:7px 0;font-size:13px}
.stat span{color:var(--ink2)}
.stat b{font-family:var(--num);font-weight:700;text-align:right}

/* ---------- plots ---------- */
.plot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.plot svg{display:block;width:100%;height:auto;touch-action:manipulation}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 11px;border-radius:6px;
  font-size:12px;max-width:290px;line-height:1.4;opacity:0;transition:opacity .1s;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.tip b{display:block;margin-bottom:2px}
.tip i{color:#9FC4BD;font-style:normal;font-size:11px}
.keys{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:12px}
.key{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer;border:none;
  background:none;padding:2px 0;font-family:var(--ui)}
.key .sw{width:11px;height:11px;border-radius:50%;flex:none}
.key[aria-pressed=false]{opacity:.32}

/* ---------- tables ---------- */
.scroll{overflow:auto;max-height:640px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;font-family:var(--num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink2);border-bottom:1.5px solid var(--ink);padding:8px 9px;white-space:nowrap;
  position:sticky;top:0;background:var(--panel);z-index:2}
table.dt td{border-bottom:1px solid var(--line);padding:9px 9px;vertical-align:top}
table.dt td.n{font-family:var(--num);text-align:right;white-space:nowrap}
table.dt tbody tr:hover td{background:#EEF3F1}
.pill{display:inline-block;font-family:var(--num);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:9px;background:var(--salt);color:var(--ink2);white-space:nowrap}
.pill.t{background:#DCEAE5;color:#0B3B45}.pill.r{background:#F5E0D6;color:#8C3616}
.pill.s{background:#F7EBD9;color:#7A5518}.pill.n{background:#E7DFF2;color:#4A2D73}

.bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:20px}
.bignum{background:var(--panel);padding:14px 16px}
.bignum b{font-family:var(--num);font-size:26px;font-weight:700;display:block;line-height:1.1;letter-spacing:-.02em}
.bignum span{font-size:11.5px;color:var(--ink2);display:block;margin-top:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.gap{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px;position:relative}
.gap .num{font-family:var(--num);font-size:11px;color:#fff;background:var(--rust);width:23px;height:23px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:10px}
.gap h4{font-size:16px;margin-bottom:8px}
.gap dt{font-family:var(--num);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:11px}
.gap dd{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.gap dd.strong{color:var(--ink)}
footer{border-top:1px solid var(--line);margin-top:38px;padding:20px 0 10px;color:var(--ink2);font-size:12px;max-width:100ch}
footer b{color:var(--ink)}

/* ---------- entity profile drawer ---------- */
#drawer{position:fixed;inset:0;z-index:100;display:none}
#drawer.on{display:block}
.dw-scrim{position:absolute;inset:0;background:rgba(14,40,49,.42)}
.dw-panel{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);
  box-shadow:-8px 0 40px rgba(11,59,69,.28);display:flex;flex-direction:column;animation:dwin .16s ease-out}
@keyframes dwin{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.dw-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);position:relative;flex:none}
.dw-head h3{margin-top:2px}
.dw-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:26px;line-height:1;
  color:var(--ink3);cursor:pointer;padding:0 4px}
.dw-x:hover{color:var(--ink)}
.dw-back{background:none;border:none;color:var(--teal);font-family:var(--ui);font-size:12.5px;cursor:pointer;
  padding:0;margin-bottom:8px;display:block}
.dw-body{padding:18px 24px 40px;overflow-y:auto;flex:1}
.dw-sec{margin-top:22px}
.dw-sec h4{font-size:14px;margin-bottom:2px}
.dw-body .plist li:hover{background:#EEF3F1}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--num);font-size:10px;letter-spacing:.04em;padding:3px 8px;border-radius:10px;
  background:var(--salt);color:var(--ink2)}
@media(max-width:560px){.dw-panel{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

al Valley Water Reclamation Facility (CVWRF)","ty":"Utility / operator","o":"Salt Lake City, UT","u":"Wastewater treatment — largest in Utah","d":"Utah’s largest wastewater treatment facility. Treats over 50 million gallons per day against a 75 MGD capacity, serving seven water districts through the central Salt Lake Valley. Mid-way through an approximately $534 million capital program (CVWRF, 2024) of upgrades and rebuilds driven by federal phosphorus-removal standards. Anaerobic digestion of biosolids and food waste in egg-shaped digesters produces methane; a 1.3 MW combined-heat-and-power system supplies over 85% of the plant’s electrical demand. Effluent discharges to Mill Creek and t","m":"No IP assessed. Operationally the single largest sewage, sludge, phosphorus and anaerobic-digestion asset in the state, and a natural pilot host.","c":"","src":"abc4.com Be Water Wise (Aug 2023); broadusa.com portfolio","new":"added","k":["Water treatment","Phosphate","Wastewater","Sewage","Effluent","Reclaimed water","Sludge","Anaerobic digestion","River","Lake","Agricultural water"]},{"n":"Salt Lake City Public Utilities Water Reclamation Facility","ty":"Utility / operator","o":"2020 N Redwood Road, Salt Lake City, UT 84116","u":"Wastewater treatment & pretreatment regulation","d":"Salt Lake City’s water reclamation plant, operating 24/7 to meet its Utah Pollution Discharge Elimination System (UPDES) permit. Runs the City pretreatment program overseeing industrial and commercial wastewater discharged into the City sanitary sewer system, i.e. the publicly owned treatment works, under the Clean Water Act, 40 CFR 403 and Utah Administrative Code R317-8-8.","m":"No IP. A vendor article reports ~55 MGD treated, advanced nutrient removal, tertiary filtration, UV disinfection and $175M in federal Bipartisan Infrastructure Law funding — those figures come from a supplier marketing page and are NOT confirmed against the City. Treat as unverified until checked wi","c":"","src":"slc.gov/utilities/projects/wrf; unconfirmed figures from ampacwatersystems.com","new":"added","k":["Water treatment","Filtration","Disinfection","Nutrient removal","Wastewater","Reclaimed water","Lake","Sewer"]},{"n":"South Valley Water Reclamation Facility","ty":"Utility / operator","o":"West Jordan, UT","u":"Wastewater treatment","d":"Interlocal agency on the west bank of the Jordan River treating wastewater for Sandy, Herriman, Midvale, West Jordan, South Jordan, Riverton, Bluffdale, Draper, Copperton and unincorporated south Salt Lake County — a 200 square mile service area. Oxidation ditch design, in service since 1985; 38 MGD capacity as of 1998 at a construction cost of $40 million.","m":"No IP. Second major reclamation operator in the valley.","c":"","src":"uasd.org district listing","new":"added","k":["Water treatment","Oxidation","Wastewater","Reclaimed water","River","Lake"]},{"n":"Jordan Valley Water Treatment Plant","ty":"Utility / operator","o":"Jordan Valley Water Conservancy District, UT","u":"Drinking water treatment","d":"The largest conventional water treatment plant in Utah, rated at 180 million gallons per day and frequently at capacity through the summer. Built 1972, expanded 1979 and 1986; deed transferred from Central Utah Water Conservancy District to Jordan Valley Water and the Metropolitan Water District of Salt Lake and Sandy in 2007. JVWCD also owns and operates a 20 MGD high-rate clarification plant built 1985 and process-enhanced in 2000.","m":"No IP. High-rate clarification is the only confirmed Utah coagulation/flocculation asset found this pass.","c":"","src":"jvwcd.gov/about/facilities","new":"added","k":["Water treatment","Coagulation","Flocculation","Lake"]},{"n":"Utah DEQ — Division of Water Quality, wastewater permitting","ty":"Center / agency","o":"State agency","u":"Regulator","d":"Issues UPDES discharge permits and, under authority given to the Utah Water Quality Board, operating permits for wastewater treatment and disposal systems including large underground wastewater treatment and disposal systems. Maintains the statewide list of large underground wastewater disposal systems by county and district. Operating permit rule at Utah Administrative Code R317-5-1.4; delegation to local health departments urged, with Weber-Morgan the only department so far granted it.","m":"Regulatory gatekeeper for any reuse, effluent or onsite treatment technology deployed in Utah.","c":"","src":"deq.utah.gov/water-quality/wastewater-treatment-and-disposal-systems-operating-permits","new":"added","k":["Water treatment","Wastewater","Effluent","Water reuse"]},{"n":"UGS Groundwater Program — National Ground-Water Monitoring Network","ty":"Center / agency","o":"Utah Geological Survey","u":"Janae Wallace, Senior Geologist · 801-537-3387 · janaewallace@utah.gov · 1594 West Temple Suite 3110, SLC 84116","d":"Utah’s water-quality data provider to the federal National Ground-Water Monitoring Network, a member since 2014. Maintains 104 monitoring wells, the majority collecting hourly data since 2011, and serves 109 sites combining wells and springs to the NGWMN portal. Covers the Basin and Range basin-fill aquifer, the Basin and Range carbonate-rock aquifers and the Colorado Plateau aquifer. EPA provides no-cost laboratory chemistry; USGS funds portal submission. UGS added the spring category to the na","m":"Public-domain monitoring data, no IP. This is the state’s groundwater-monitoring backbone and it was entirely absent from the inventory.","c":"","src":"usgs.gov/apps/ngwmn/provider/UTGS; geology.utah.gov/map-pub/survey-notes/ugs-role-groundwater-network","new":"added","k":["Environmental sensing","Groundwater","Aquifer","Well","Watershed"]},{"n":"UGS West Desert Groundwater Monitoring Network","ty":"Center / agency","o":"Utah Geological Survey","u":"Hugh A. Hurlow; Stefan Kirby","d":"Legislature-mandated in 2007 and designed to run 50-plus years, in response to proposed large-scale Southern Nevada Water Authority cture"],"matrix":[[1,2,3,4,5],[2,2,3,4,4],[3,4,5,5,4],[4,5,5,5,5],[4,4,4,3,3],[2,3,4,4,4],[3,4,4,5,5],[2,2,3,3,2],[1,2,2,3,3]],"priority":[{"name":"Agricultural water efficiency","score":9.4,"rdom":"Agricultural water","why":"Agriculture is roughly 65% of Great Salt Lake basin depletion and ~74% of statewide consumptive use (Division of Water Resources figure to confirm) — the largest single lever on the lake","anchor":"USU (irrigation, agroclimate), BYU (agricultural water quality)","state":200,"stateNote":"Agricultural Water Optimization Program — $200M (SB 277, 2023)","researchers":9,"lead":8,"patents":5,"live":3},{"name":"Dust & GSL mitigation","score":8.7,"rdom":"Dust & Great Salt Lake","why":"Exposed lakebed is a public-health and snowpack threat, and globally distinctive as a problem set","anchor":"U of U (Perry, Skiles), Westminster (Baxter)","state":18.25,"stateNote":"GSL investments and water leasing $10M · Basin Integrated Plan $5M state + $3.1M federal · dust monitoring $150K","researchers":24,"lead":24,"patents":1,"live":1},{"name":"Water reuse & recycling","score":8.1,"rdom":"Reuse, treatment & quality","why":"Stretches supply in an arid, growing state, with strong corporate and utility demand","anchor":"USU (Sims / RABR), U of U (Weidhaas, Goel)","state":0,"stateNote":"No dedicated state appropriation identified in the funding appendix","researchers":22,"lead":14,"patents":15,"live":9},{"name":"Metering & digital water","score":7.8,"rdom":"Digital water & sensing","why":"Efficiency and demand management; data-rich, capital-light and startup-friendly","anchor":"USU (meter accuracy), Utah Mesonet","state":1.6,"stateNote":"Transparent Water Billing $1M · Growing Water Smart $600K (2024)","researchers":31,"lead":15,"patents":0,"live":0},{"name":"Snow & supply forecasting","score":7,"rdom":"Snow & supply forecasting","why":"Snowpack is Utah’s reservoir, and AI/ML forecasting is a national research strength","anchor":"U of U (Johnson, Steenburgh), USU (Tarboton)","state":16,"stateNote":"Cloud seeding $16M (2025) · SNOWSCAPE initiative — amount not stated in source","researchers":28,"lead":25,"patents":1,"live":0},{"name":"Desalination & brine valorization","score":6.2,"rdom":"Brine & critical minerals","why":"Turns Great Salt Lake and produced-water brine from a liability into a resource","anchor":"U of U (Hong), Uinta Basin produced water","state":0,"stateNote":"No dedicated state appropriation identified in the funding appendix","researchers":8,"lead":7,"patents":14,"live":2}],"gaps":[{"n":1,"g":"A dedicated water accelerator","sev":"High priority","breaks":"A founder with a validated idea has no clear next step — no cohort, no mentors, no established path from bench to market, and no first capital.","costs":"Promising research rarely becomes a company, and the ideas that do gain traction often move to regions that already offer a program.","build":"A Utah Water Accelerator on the Imagine H2O model — cohorts, a purpose-built commercialization curriculum covering water procurement cycles and utility sales, and mentors drawn from water veterans already in the state. Demand-led from cohort one.","model":"Imagine H2O · Milwaukee BREW","lead":"Platform accelerator lead + corporate sponsors + economic development"},{"n":2,"g":"Early-stage capital","sev":"High priority","breaks":"There is not yet a dedicated water fund, and generalist VCs, unfamiliar with utility sales cycles, often pass.","costs":"The few startups that form may relocate to where the capital is, or run short on runway. Either way, Utah misses jobs and IP that could have stayed.","build":"An evergreen Water Innovation Fund writing first checks of roughly $50K to $500K, with catalytic state and philanthropic capital in a first-loss layer and private LPs above it. Partner upward with the national water funds rather than compete.","model":"Burnt Island · XPV · Emerald · PureTerra · Colorado River Basin Fund","lead":"State + platform"},{"n":3,"g":"A pilot pathway","sev":"Important","breaks":"A startup with a working product cannot get it trialed at scale. Utilities are risk-averse and procurement-bound, which is a rational response to their obligations.","costs":"Nothing gets proven in-state, so nothing gets bought in-state.","build":"A member-voted pilot network where utilities and irrigation districts choose the shortlist themselves, backed by a revolving fund that refills when a pilot converts. Fund part of it as economic development.","model":"Isle Utilities TAG · Nevada WaterStart","lead":"Platform + utilities"},{"n":4,"g":"Coordinated corporate engagement","sev":"Important","breaks":"Corporate interest — from the water majors (Xylem, Veolia, Ecolab, Pentair) and now from data centers — arrives, finds no clear counterpart, and often dissipates.","costs":"R&D dollars and relocations tend to land wherever a region is organized to receive them. The Governor’s economic-development office courts them, but is measured on growth, not water stewardship.","build":"A paid corporate-affiliates program giving one front door, plus a data-center water-stewardship consortium that turns that load into organized demand rather than public dispute over allocation.","model":"Plug and Play · Singapore PUB","lead":"Platform + economic development"},{"n":5,"g":"A backbone organization","sev":"Important","breaks":"No single organization yet holds responsibility for the ecosystem as a whole.","costs":"Each opportunity above stays unowned, and strong assets remain siloed.","build":"A lean, neutral, cross-institutional backbone owned by no single university or agency — most likely a 501(c)(3), giving the institutions a neutral venue for the IP terms and single point of contract industry partners ask for. Bridge with a fiscal sponsor while it forms.","model":"WaterCampus Leeuwarden","lead":"Governor’s office + the research universities + GSL Commissioner"}],"bench":[{"n":"Imagine H2O","loc":"San Francisco, US","what":"Water-technology accelerator running themed cohorts around problems posed by corporate and utility partners; operating since 2009.","fund":"Corporate sponsors (Xylem and others) plus philanthropy — Coca-Cola Foundation, Oceankind. 501(c)(3); takes no equity. Reported funding: ~$8.5M received 2019–2024 across 38 grants and 12 funders.","rel":"Transfers almost unchanged. Challenges can be aimed at agriculture and the lake.","url":"imagineh2o.org"},{"n":"The Water Council / BREW","loc":"Milwaukee, US","what":"Regional cluster with a physical Global Water Center plus a BREW accelerator co-founded with the state economic-development agency as deliberate industrial policy.","fund":"Member dues plus the Wisconsin Economic Development Corporation, which seeded BREW at $50K per startup and helped fund the Global Water Center. $2.5M SBA award (2024, 5-year); BREW seeded startups at ~$50K each.","rel":"The closest American precedent. Utah has the state apparatus; industrial-anchor appetite is untested.","url":"thewatercouncil.com"},{"n":"WaterCampus Leeuwarden","loc":"Friesland, Netherlands","what":"Research, applied development and business separated into distinct organizations and linked by an explicit chain, with a shared validation facility. Wetsus is the research anchor.","fund":"City of Leeuwarden, Province of Fryslân, Dutch national and EU programs, plus company membership fees into Wetsus.","rel":"Proof that size was never the constraint — structure and patience were. Logan and the UWRL are a genuine analogue.","url":"watercampus.nl"},{"n":"Fraunhofer","loc":"Germany","what":"Applied research institutes whose public base funding is tied to industry contract income, so commercial relevance is built into the budget.","fund":"Public base funding matched to industry contract income.","rel":"Match state money to industry-sponsored water research.","url":"fraunhofer.de"},{"n":"PUB","loc":"Singapore","what":"National water utility acting as innovation driver and first customer.","fund":"Government statutory board with its own capital budget. S$100M initial funding from the National Research Foundation Singapore (RIE2030).","rel":"Give the large districts an innovation mandate with pilot budgets and cover when a trial fails.","url":"pub.gov.sg"},{"n":"Isle Utilities TAG / WaterStart","loc":"UK and Nevada, US","what":"Member utilities vote on which technologies get evaluated; a revolving fund pays for trials and refills on conversion.","fund":"Isle on utility member subscriptions; WaterStart on Nevada’s Knowledge Fund through GOED, plus member and philanthropic contributions. Isle: ~150 members at ~£20k/year; WaterStart launched with $4.3M GOED funds, now ~$1.8M; corporate dues $25–50k.","rel":"The most directly copyable fix for the pilot gap. WaterStart is next door under the same conditions.","url":"isleutilities.com · waterstart.com"},{"n":"NSF Engines / Great Lakes ReNEW","loc":"US federal","what":"Large, multi-year, place-based awards building multi-institution ecosystems. Great Lakes ReNEW, coordinated by Current in Chicago, is the water proof case.","fund":"Up to $160M per Engine over ten years, released in stages against milestones, with state and partner matching expected. NSF commitment to ReNEW raised to about $60M, March 2026.","rel":"The largest single prize available. Arid West, saline lake, multiple institutions — Utah fits the profile.","url":"nsf.gov/funding/initiatives/regional-innovation-engines"}],"roadmap":[{"ph":"First 30 days","items":[["Verify the NSF Engines pitch window","Confirm with NSF TIP directly whether a solicitation is open and on what timetable, then decide go or no-go. A credible pitch needs six-plus months of teaming.","Platform lead"],["Charter the backbone, or bridge it","File as an independent nonprofit — 501(c)(3) for research, convening and public benefit; 501(c)(6) if member- and industry-driven — or sign a fiscal-sponsor agreement so applications can go out under an existing EIN.","Governor’s office + universities"],["Adopt the top three domains","A written decision naming agriculture, dust and the lake, and reuse as flagship focus, so staff time stops being spread across six.","Convening body"],["Assign named relationship owners","One person accountable for each of the seven stakeholder groups. A name, not a committee.","Platform lead"]]},{"ph":"Months 1–3","items":[["Secure the state anchor and structure the fund","A dollar figure and a legal vehicle: evergreen, catalytic state and philanthropic capital in a first-loss layer, private LPs above.","State + platform"],["Publish the map’s first two layers","The 181-name researcher directory and the university patent portfolios, as a public searchable list. The cheapest credibility the platform can buy.","Platform staff"],["Build value-proposition sheets and seat the board","One page per stakeholder group covering what they get and what they owe, then recruit the board from the high-influence, high-interest quadrant.","Platform lead"],["Define accelerator challenge statements","Turn the practitioner needs into eight to twelve specific problem statements, each with a named buyer behind it.","Staff + Commissioner"],["Commission the primary-data refresh","Replace planning-estimate domain scores with market figures, so the scoring can be cited rather than caveated.","Research partner"]]},{"ph":"Months 3–12","items":[["Launch accelerator cohort 1","Imagine H2O model: zero equity, corporate sponsors, demand-led from the first cohort.","Accelerator lead"],["Stand up the pilot network","Recruit member utilities, set the voting mechanism, capitalize the revolving trial fund.","Platform + utilities"],["Open corporate affiliates and the data-center consortium","Paid membership tiers for the water majors, plus a consortium turning data-center load into organized stewardship demand.","Platform"],["Add the live map layers","Startups, pilots, funding and challenges — the layers that go stale, which is why one named owner matters more than the initial build.","Platform staff"],["Scope the physical center and the Nevada partnership","Feasibility work on a Utah Water Center, and open talks with WaterStart on a two-state pilot network.","Platform lead"],["Convene advisory councils and begin tribal engagement","Nation to nation, led by tribal governments and water offices directly.","Platform + Commissioner"]]}],"funding":[["Agricultural Water Optimization Program","$200M (SB 277, 2023); $151M obligated, $57M disbursed (Jul 2025)","State appropriation","Water-saving agricultural technology; ~250 of 700 projects complete, est. savings over 40,891 acre-feet/yr (The Water Report; GSL Collaborative)"],["Great Salt Lake investments / water leasing","$10M (2024; $20M requested)","State appropriation","Split-season and seasonal leases sending water to the lake"],["Cloud seeding / snowpack enhancement","$16M (2025; up from $200K in 2022)","State — Div. of Water Resources","The nation’s largest cloud-seeding program, 190 generators"],["SNOWSCAPE snow research initiative","Div. of Water Resources (2026)","State — Div. of Water Resources","Snowpack and cloud-seeding evaluation with U of U, USU, NCAR"],["GSL Basin Integrated Plan","$5M state (HB 429, 2022) + $3.1M federal","State + federal (Bureau of Reclamation)","Basin-wide water-supply research and planning"],["GSL dust monitoring / health research","$150K of $651K requested (2025)","State appropriation","Dust composition and health-impact monitoring — underfunded vs. request"],["Transparent Water Billing; Growing Water Smart","$1M; $600K (2024)","State — Div. of Water Resources","Conservation behavior tools; water-smart city planning"],["US Magnesium water-rights acquisition","$30M (2026 budget)","State appropriation","~144,790 acre-feet of water rights redirected to the lake (total volume, not annual); $30M winning bid, Jan 2026"],["UGS Produced-Water Management Tools, Uinta Basin","Federal share of a $14.2M multi-project award","Federal — RPSEA Small Producer Program, DOE NETL","Basin-scale produced-water management tools; UGS Bulletin 138 (2017)"],["UGS groundwater-quality monitoring (NGWMN)","In-kind plus project awards","Federal — USGS portal, EPA laboratory chemistry","104 monitoring wells, 109 well and spring sites, hourly data since 2011"],["Microalgae in Uinta Basin produced water","$125,000 (2015)","State — Utah Office of Energy Development","Biofuel, biogas and bioplastic feedstock from spent fracturing fluid"],["IRA Great Salt Lake water markets","$50M federal (Dec 2024; paused Feb 2025)","Federal (Inflation Reduction Act)","$10M water-leasing market + $40M wetland and ecosystem habitat; Bureau of Reclamation / IRA, status paused since 2025"]],"stake":[["Universities & Research","A commercialization pathway for IP; a magnet for federal center grants; industry-sponsored research","Licensable technology, researchers, facilities, co-applicant status on federal bids"],["Companies & Industry","Early access to vetted innovation; a pilot pathway; acquisition targets; a reason to locate R&D here","Challenge statements, sponsorship, pilot hosting, first-customer commitments"],["Investors & Capital","De-risked deal flow; co-investment; a differentiated arid-West thesis with federal tailwinds","Seed and follow-on capital, and diligence expertise"],["Government & Public Sector","Economic development; federal-dollar leverage; measurable progress on the state’s defining priority","Anchor funding, convening authority, policy and procurement support"],["Non-Profits & NGOs","A pipeline of deployable solutions for the lake and the watershed they steward","Public trust, community legitimacy, on-the-ground reach"],["Water Users & Stakeholders","Tools and incentives to conserve while protecting yields, rights and resilience","Practitioner-identified needs, pilot sites, adoption of what works"],["Federal Partners","A coordinated, multi-institution partner able to win and execute large center awards","Grant funding, research programs, national const TRAMP = ['#0B3B45', '#17786F', '#6E8A54', '#B8862C', '#B4491F'];
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mix(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const x = t * (stops.length - 1), i = Math.min(Math.floor(x), stops.length - 2), f = x - i;
  const a = hex2rgb(stops[i]), b = hex2rgb(stops[i + 1]);
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)})`;
}

function heatTable(rows, cols, get, opts) {
  const o = Object.assign({ label: v => v, invert: false, gamma: 0.55, rowTotals: null, colTotals: null,
                            sel: null, rowKey: r => r, colKey: c => c, zero: '\u00b7' }, opts);
  let max = 1;
  rows.forEach(r => cols.forEach(c => { const v = get(r, c); if (v > max) max = v; }));
  let h = '<table class="hm"><thead><tr><th class="rowh"></th>';
  cols.forEach(c => h += `<th style="max-width:92px;white-space:normal">${esc(o.colKey(c))}</th>`);
  if (o.rowTotals) h += '<th style="color:var(--ink)">Total</th>';
  h += '</tr></thead><tbody>';
  rows.forEach(r => {
    h += `<tr><th class="rowh" style="max-width:220px;white-space:normal">${o.rowKey(r)}</th>`;
    cols.forEach(c => {
      const v = get(r, c);
      const t = o.invert ? (v - o.min) / (o.max - o.min) : 1 - Math.pow(v / max, o.gamma);
      const dim = o.sel && !o.sel(r, c) ? ' dim' : '';
      h += `<td><button class="cell${dim}" data-r="${esc(String(r))}" data-c="${esc(String(c))}"
        style="background:${v || o.invert ? ramp(t) : '#EFEDE6'};color:${v || o.invert ? readable(t) : '#B3BDB8'};font-size:${v || o.invert ? '' : '17px'}">
        ${o.label(v, r, c) || o.zero}</button></td>`;
    });
    if (o.rowTotals) h += `<td><div class="cell marg"><b>${o.rowTotals(r)}</b></div></td>`;
    h += '</tr>';
  });
  if (o.colTotals) {
    h += '<tr><th class="rowh" style="font-weight:400;color:var(--ink2)">Total</th>';
    cols.forEach(c => h += `<td><div class="cell marg"><b>${o.colTotals(c)}</b></div></td>`);
    if (o.rowTotals) h += '<td></td>';
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

/* hand-rolled force layout, no dependencies */
function makeSim(nodes, links, W, H, opts) {
  const o = Object.assign({ charge: -40, link: .035, center: .07, collide: 2.1, damp: .84 }, opts || {});
  let alpha = 1;
  return {
    reheat() { alpha = 1; },
    tick() {
      alpha *= .988; if (alpha < .004) alpha = .004;
      for (const n of nodes) { n.vx += (n.cx - n.x) * o.center * alpha * 8; n.vy += (n.cy - n.y) * o.center * alpha * 8; }
      for (let a = 0; a < nodes.length; a++) {
        const A = nodes[a];
        for (let b = a + 1; b < nodes.length; b++) {
          const B = nodes[b];
          const dx = B.x - A.x, dy = B.y - A.y, d2 = dx * dx + dy * dy;
          if (d2 > 26000 || d2 === 0) continue;
          const d = Math.sqrt(d2), f = o.charge * alpha / d;
          const fx = dx / d * f, fy = dy / d * f;
          A.vx += fx; A.vy += fy; B.vx -= fx; B.vy -= fy;
        }
      }
      for (const l of links) {
        const A = l.s, B = l.t;
        const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1;
        const f = (d - l.len) * o.link * l.w * alpha * 6;
        A.vx += dx / d * f; A.vy += dy / d * f; B.vx -= dx / d * f; B.vy -= dy / d * f;
      }
      for (let a = 0; a < nodes.length; a++) {
        const A = nodes[a];
        for (let b = a + 1; b < nodes.length; b++) {
          const B = nodes[b], min = (A.r + B.r) * o.collide * .5 + 1.6;
          const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
          if (d < min && d > 0) { const s = (min - d) / d * .42; A.x -= dx * s; A.y -= dy * s; B.x += dx * s; B.y += dy * s; }
        }
      }
      for (const n of nodes) {
        n.vx *= o.damp; n.vy *= o.damp; n.x += n.vx; n.y += n.vy;
        n.x = Math.max(n.r + 4, Math.min(W - n.r - 4, n.x));
        n.y = Math.max(n.r + 4, Math.min(H - n.r - 4, n.y));
      }
    }
  };
}
function cells(keys, W, H, pad) {
  pad = pad || 0;
  const n = keys.length, out = {};
  const cols = Math.max(1, Math.ceil(Math.sqrt(n * W / H))), rows = Math.ceil(n / cols);
  const cw = W / cols, ch = (H - pad) / rows;
  keys.forEach((k, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    out[k] = { x: cw * (c + .5), y: pad + ch * (r + .5) + ch * .06, top: pad + ch * r + 16 };
  });
  return out;
}

  const xmax = Math.max(...P.map(d => d[xk])) * 1.2 + 1;
  const X = v => m.l + (v / xmax) * (W - m.l - m.r);
  const Y = v => H - m.b - ((v - 5.5) / 4.5) * (H - m.t - m.b);
  const R = d => sizeMode === 'flat' ? 20 : 14 + Math.sqrt(d.state) * 3.6;
  const maxP = Math.max(...P.map(d => d.patents));
  let g = '';
  for (let v = 6; v <= 10; v++) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#CBD4D2"/>
    <text x="${m.l - 9}" y="${Y(v) + 4}" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="#4A6068">${v}.0</text>`;
  [0, 10, 20, 30].filter(v => v <= xmax).forEach(v => g += `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}" stroke="#E7EAE8"/>
    <text x="${X(v)}" y="${H - m.b + 19}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#4A6068">${v}</text>`);
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 16}" text-anchor="middle" font-family="Cambria,Georgia,serif" font-size="13" fill="#0E2831">
    ${xk === 'researchers' ? 'Named researchers whose recorded focus touches the domain' : 'Patent records in the master inventory'}</text>
    <text x="18" y="${(m.t + H - m.b) / 2}" text-anchor="middle" font-family="Cambria,Georgia,serif" font-size="13" fill="#0E2831"
      transform="rotate(-90,18,${(m.t + H - m.b) / 2})">Priority score from the plan</text>`;
  const pts = P.map((d, i) => ({ d, i, x: X(d[xk]), y: Y(d.score), r: R(d) }));
  pts.forEach(p => {
    const { d, i, x, y, r } = p, sel = alPin === i, t = 1 - (d.patents / Math.max(1, maxP));
    g += `<circle cx="${x}" cy="${y}" r="${r}" fill="${ramp(t)}" fill-opacity="${sel ? 1 : .87}"
      stroke="${sel ? '#0E2831' : '#fff'}" stroke-width="${sel ? 3 : 1.8}" data-i="${i}" style="cursor:pointer"/>
      <text x="${x}" y="${y + 4.5}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5"
      font-weight="700" fill="${readable(t)}" pointer-events="none">${d.patents}</text>`;
  });
  const placed = [];
  pts.slice().sort((a, b) => a.y - b.y).forEach(p => {
    const { d, x, y, r } = p; let ly = y - r - 24; const w = d.name.length * 6.4; let guard = 0;
    const clash = () => placed.some(q => Math.abs(q.x - x) < (q.w + w) / 2 + 8 && Math.abs(q.y - ly) < 26)
      || pts.some(q => q.i !== p.i && Math.abs(q.x - x) < q.r + w / 2 + 4 && ly > q.y - q.r - 16 && ly - 14 < q.y + q.r + 4);
    while (clash() && guard++ < 22) ly -= 12;
    if (ly < 24) ly = y + r + 22;
    placed.push({ x, y: ly, w });
    if (y - r - ly > 30) g += `<line x1="${x}" y1="${ly + 20}" x2="${x}" y2="${y - r - 3}" stroke="#A9B5B1" stroke-dasharray="2 3"/>`;
    g += `<text x="${x}" y="${ly}" text-anchor="middle" font-family="Cambria,Georgia,serif" font-size="12.5" font-weight="700" fill="#0E2831" pointer-events="none">${esc(d.name)}</text>
      <text x="${x}" y="${ly + 14}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#4A6068" pointer-events="none">${d.state > 0 ? '$' + d.state + 'M state' : 'no state $'} \u00b7 ${d.researchers} researchers</text>`;
  });
  $('#alSvg').innerHTML = g;
  $('#alSvg').onclick = e => { const c = e.target.closest('circle[data-i]'); alPin = c ? (alPin === +c.dataset.i ? null : +c.dataset.i) : null; alDraw(); };
  $('#alSvg').onmousemove = e => {
    const c = e.target.closest('circle[data-i]'), tip = $('#alTip');
    if (!c) { tip.style.opacity = 0; return; }
    const d = P[+c.dataset.i], box = $('#alPlot').getBoundingClientRect();
    tip.innerHTML = `<b>${esc(d.name)}</b><i>score ${d.score} \u00b7 ${d.researchers} researchers \u00b7 ${d.patents} patents \u00b7 $${d.state}M</i><br>${esc(d.why)}`;
    tip.style.opacity = 1; tip.style.left = Math.min(box.width - 300, e.clientX - box.left + 14) + 'px'; tip.style.top = (e.clientY - box.top + 14) + 'px';
  };
  $('#alSvg').onmouseleave = () => $('#alTip').style.opacity = 0;

  const sideEl = $('#alSide');
  if (alPin === null) {
    const total = P.reduce((a, d) => a + d.state, 0);
    sideEl.innerHTML = `<div class="kicker">Six scored domains</div><h3>Where strengths and resources differ</h3>
      <div class="stat"><span>State dollars attributed</span><b>$${total.toFixed(2)}M</b></div>
      <div class="stat"><span>Share going to agriculture</span><b>${(100 * 200 / total).toFixed(0)}%</b></div>
      <div class="stat"><span>Researchers behind agriculture</span><b>${P[0].researchers} of ${D.people.length}</b></div>
      <p style="font-size:12.5px;margin-top:14px"><b>No patent record at all</b><br><span style="color:var(--ink2)">${P.filter(d => d.patents === 0).map(d => d.name).join(' \u00b7 ') || 'none'}</span></p>
      <p style="font-size:12.5px;margin-top:9px"><b>No state appropriation named</b><br><span style="color:var(--ink2)">${P.filter(d => d.state === 0).map(d => d.name).join(' \u00b7 ') || 'none'}</span></p>
      <p style="font-size:12.5px;color:var(--ink2);margin-top:14px">Click a bubble for the detail behind it.</p>`;
  } else {
    const d = P[alPin];
    sideEl.innerHTML = `<div class="kicker">Priority domain</div><h3>${esc(d.name)}</h3>
      <p style="font-size:12.5px;color:var(--ink2);margin:3px 0 10px">${esc(d.why)}</p>
      <div class="stat"><span>Score in the plan</span><b>${d.score.toFixed(1)}</b></div>
      <div class="stat"><span>Researchers touching it</span><b>${d.researchers}</b></div>
      <div class="stat"><span>Researchers led by it</span><b>${d.lead}</b></div>
      <div class="stat"><span>Patent records</span><b>${d.patents}</b></div>
      <div class="stat"><span>Not expired</span><b>${d.live}</b></div>
      <div class="stat"><span>State dollars attributed</span><b>$${d.state}M</b></div>
      <p style="font-size:12.5px;margin-top:12px"><b>Research anchor</b><br><span style="color:var(--ink2)">${esc(d.anchor)}</span></p>
      <p style="font-size:12.5px;margin-top:9px"><b>Appropriations counted</b><br><span style="color:var(--ink2)">${esc(d.stateNote)}</span></p>`;
  }
  $('#alTable').innerHTML = `<thead><tr><th>Priority domain</th><th>Score</th><th>Researchers</th><th>Lead focus</th>
    <th>Patents</th><th>Not expired</th><th>State $M</th><th>Research anchor</th></tr></thead><tbody>${P.map(d =>
    `<tr><td><b>${esc(d.name)}</b></td><td class="n">${d.score.toFixed(1)}</td><td class="n">${d.researchers}</td>
     <td class="n">${d.lead}</td><td class="n">${d.patents}</td><td class="n">${d.live}</td>
     <td class="n">${d.state ? d.state.toFixed(2) : '\u2014'}</td><td style="color:var(--ink2)">${esc(d.anchor)}</td></tr>`).join('')}</tbody>`;
}

function kwDraw() {

  const M = {};
  D.cats.forEach(c => { M[c] = {}; TYPES.forEach(t => M[c][t] = 0); });

function kwSide() {
  const el = $('#kwSide');
  if (!kwTerm) {
    const prose = D.terms.filter(x => x.n === 0 && x.m > 0).sort((a, b) => b.m - a.m);
    const noIP = D.terms.filter(x => x.R > 0 && x.P === 0 && x.C === 0).sort((a, b) => b.R - a.R).slice(0, 6);
    el.innerHTML = `<div class="kicker">Search queue</div><h3>Where to look next</h3>
      <p style="font-size:12.5px;color:var(--ink2);margin:4px 0 10px">Ordered by how loudly the documents already argue for something the inventory cannot name.</p>

      ${noIP.map(x => `<div class="stat"><span>${esc(x.t)}</span><b>${x.R} researchers</b></div>`).join('')}
      <p style="color:var(--ink2);font-size:12px;margin-top:14px">Click any term in the table for the records behind it.</p>`;
    return;
  }
  const x = D.terms.find(y => y.t === kwTerm); if (!x) return;
  const hit = e => (e.k || []).includes(kwTerm);
  const hits = [...D.people.filter(hit).map(p => ({ id: 'p:' + D.people.indexOf(p), n: p.n, t: 'Researcher', o: p.i, d: p.f, c: '' })),
                ...D.patents.filter(hit).map(p => ({ id: 't:' + D.patents.indexOf(p), n: p.no, t: 'Patent', o: p.as, d: p.ti, c: p.st })),
                ...D.orgs.filter(hit).map(o => ({ id: 'o:' + D.orgs.indexOf(o), n: o.n, t: o.ty, o: o.o, d: o.d, c: '', s: o.src, nw: o.new }))];
  const s = kwState(x);
  el.innerHTML = `<div class="kicker">${esc(x.c)}</div><h3>${esc(x.t)}</h3>
    <p style="font-size:12.5px;margin:4px 0 8px"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${KW_TINT[s]};margin-right:7px"></span>${KW_LABEL[s]}</p>
    <div class="stat"><span>Records matched</span><b>${x.n}</b></div>
    <div class="stat"><span>Mentions in the documents</span><b>${x.m}</b></div>
    ${hits.length ? `<ul class="plist">${hits.slice(0, 60).map(e => `<li data-ent="${e.id}" style="cursor:pointer"><b>${esc(e.n)}</b>
      <span>${esc(e.t)}${e.o ? ' \u00b7 ' + esc(e.o) : ''}</span>
      ${e.d ? `<span style="margin-top:3px">${esc(String(e.d).slice(0, 170))}</span>` : ''}
      <span style="font-family:var(--num);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;margin-top:4px">${esc(e.c)}${e.nw ? ' \u00b7 <span style="color:#B4491F">' + e.nw + ' this pass</span>' : ''}</span>
      ${e.s ? `<span style="font-size:10.5px;color:var(--ink3);margin-top:2px">${esc(e.s)}</span>` : ''}</li>`).join('')}</ul>`
      : `<p class="empty" style="margin-top:12px">${x.m > 0 ? 'No record in the inventory carries this term \u2014 but the platform documents mention it ' + x.m + (x.m === 1 ? ' time' : ' times') + '. The argument exists; the roster does not.' : 'Nothing in the inventory and nothing in the documents. Nobody has looked here yet.'}</p>`}
    <p style="margin-top:12px"><button class="btn" id="kwClear">Back to the queue</button></p>`;

}

const ENT = [];
D.people.forEach((p, i) => ENT.push({
  id: 'p:' + i, kind: 'person', name: p.n, group: p.i, sub: p.d, col: p.p,
  desc: p.r || p.f, focus: p.f, conf: '', contact: p.e, doms: p.D, k: p.k || [], ref: p
}));
D.orgs.forEach((o, i) => ENT.push({
  id: 'o:' + i, kind: 'org', name: o.n, group: o.ty, sub: o.o, col: o.ty,
  desc: o.d, focus: o.u, conf: '', contact: 0, doms: [], k: o.k || [], ref: o
}));
D.patents.forEach((p, i) => ENT.push({
  id: 't:' + i, kind: 'patent', name: p.no, group: 'Patent', sub: p.as, col: p.sb,
  desc: p.ti, focus: p.ca, conf: p.st, contact: 0, doms: [], k: p.k || [], ref: p
}));
const BY_ID = {}; ENT.forEach(e => BY_ID[e.id] = e);

/* keyword sets for overlap scoring */
ENT.forEach(e => e.kset = new Set(e.k));
function overlap(a, b) { let n = 0; for (const t of a.kset) if (b.kset.has(t)) n++; return n; }

/* Linked records for one entity, grouped by why they are linked. */
function linksFor(e) {
  const out = [];
  /* verified inventorship — a named link, not a derived one */
  if (e.kind === 'person' && (e.ref.patIds || []).length)
    out.push(['Named inventor on', e.ref.patIds.map(i => BY_ID['t:' + i]),
      'Confirmed from the inventor field of the patent record — a named link, not a derived one.']);
  if (e.kind === 'patent' && (e.ref.invIds || []).length)
    out.push(['Inventors in the researcher directory', e.ref.invIds.map(i => BY_ID['p:' + i]),
      'Matched from the inventor field to the directory on surname plus a given name. Confirmed, not inferred.']);
  if (e.kind === 'person') {
    const dept = ENT.filter(x => x.kind === 'person' && x !== e && x.sub === e.sub);
    if (dept.length) out.push(['Same department', dept.slice(0, 14),
      'Shares ' + e.sub + '. The people most likely already talking to each other.']);
    const dom = ENT.filter(x => x.kind === 'person' && x !== e && x.group !== e.group && x.doms.some(d => e.doms.includes(d)));
    if (dom.length) out.push(['Same domain, another institution', dom.slice(0, 14),
      'Working the same domains at a different institution. These are the introductions the platform exists to make.']);
  }
  const shared = ENT.filter(x => x !== e && x.kind !== 'person' && overlap(e, x) >= 2)
    .map(x => ({ x, n: overlap(e, x) })).sort((a, b) => b.n - a.n).slice(0, 14).map(o => o.x);
  if (shared.length) out.push([e.kind === 'person' ? 'Companies, IP and agencies on the same terms' : 'Related organizations and IP',
    shared, 'Matched on shared controlled-vocabulary terms \u2014 the strongest available proxy for a working connection.']);
  if (e.kind !== 'person') {
    const people = ENT.filter(x => x.kind === 'person' && overlap(e, x) >= 2)
      .map(x => ({ x, n: overlap(e, x) })).sort((a, b) => b.n - a.n).slice(0, 14).map(o => o.x);
    if (people.length) out.push(['Researchers on the same terms', people,
      'Named researchers whose recorded focus shares terms with this record. The first call list.']);
  }
  return out;
}

/* ---------------------------------------------------------------- drawer */
const drawer = document.createElement('div');
drawer.id = 'drawer';
drawer.innerHTML = '<div class="dw-scrim"></div><div class="dw-panel" role="dialog" aria-modal="true"></div>';
document.body.appendChild(drawer);
const dwStack = [];
function closeEntity() { drawer.classList.remove('on'); dwStack.length = 0; }

function openEntity(id, push) {

  } else {
    meta = `<div class="stat"><span>Type</span><b style="font-family:var(--ui);font-weight:600">${esc(r.ty)}</b></div>
      <div class="stat"><span>Location / parent</span><b style="font-family:var(--ui);font-weight:600;max-width:210px">${esc(r.o)}</b></div>
      ${r.u ? `<div class="stat"><span>Unit / contact</span><b style="font-family:var(--ui);font-weight:400;font-size:12px;max-width:210px">${esc(r.u)}</b></div>` : ''}
      ${r.src ? `<div class="stat"><span>Source</span><b style="font-family:var(--ui);font-weight:400;font-size:11.5px;max-width:210px">${esc(r.src)}</b></div>` : ''}`;
  }
  drawer.querySelector('.dw-panel').innerHTML = `
    <div class="dw-head" style="border-top:4px solid ${P}">
      <button class="dw-x" aria-label="Close">&times;</button>
      ${dwStack.length > 1 ? '<button class="dw-back">&larr; Back</button>' : ''}
      <div class="kicker">${esc(e.kind === 'person' ? 'Researcher' : e.kind === 'patent' ? 'Patent record' : r.ty)}${r.new === 'added' ? ' \u00b7 added this pass' : ''}</div>
      <h3 style="font-size:20px">${esc(e.name)}</h3>
      ${e.sub && e.kind !== 'person' ? `<p style="color:var(--ink2);font-size:12.5px;margin:3px 0 0">${esc(e.sub)}</p>` : ''}
    </div>
    <div class="dw-body">
      ${e.desc ? `<p style="font-size:13px;margin:0 0 14px">${esc(e.desc)}</p>` : ''}
      ${meta}
      ${e.doms.length ? `<div class="dw-sec"><h4>Domains</h4><div class="keys">${e.doms.map(d =>
        `<span class="key" style="cursor:default"><span class="sw" style="background:${DOM_COLOR[d] || '#B7BFBC'}"></span>${esc(d)}</span>`).join('')}</div></div>` : ''}
      ${e.k.length ? `<div class="dw-sec"><h4>Vocabulary terms on this record <span style="font-family:var(--num);color:var(--ink3);font-weight:400">${e.k.length}</span></h4>
        <div class="tags">${e.k.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>` : ''}
      ${links.map(([label, list, why]) => `<div class="dw-sec">
        <h4>${esc(label)} <span style="font-family:var(--num);color:var(--ink3);font-weight:400">${list.length}</span></h4>
        <p style="font-size:12px;color:var(--ink2);margin:0 0 8px">${esc(why)}</p>
        <ul class="plist" style="max-height:none;margin-top:0">${list.map(x => `<li data-ent="${x.id}" style="cursor:pointer">
          <b>${esc(x.name)}</b>
          <span>${esc(x.kind === 'person' ? x.group + ' \u00b7 ' + x.sub : (x.sub || x.group))}</span>
          ${x.focus ? `<span style="color:var(--teal);margin-top:2px">${esc(String(x.focus).slice(0, 110))}</span>` : ''}
        </li>`).join('')}</ul></div>`).join('')
      || '<div class="dw-sec"><p class="empty">No linked records under the current matching rules.</p></div>'}
      <p style="font-size:11.5px;color:var(--ink3);margin-top:18px">Links are derived \u2014 shared department,
      shared domain, or two or more shared vocabulary terms. They indicate where a connection is plausible, not that
      one exists. Treat them as a call list, not a relationship map.</p>
    </div>`;
  drawer.classList.add('on');
  drawer.querySelector('.dw-x').onclick = closeEntity;
  const back = drawer.querySelector('.dw-back');
  if (back) back.onclick = () => { dwStack.pop(); openEntity(dwStack[dwStack.length - 1], false); };
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ent]');
  if (t) { e.preventDefault(); openEntity(t.dataset.ent); }
});

/* ---------------------------------------------------------------- view */
const NWW = 900, NWH = 560;
let nwN = null, nwRaf = null, nwSel = null, nwQ = '', nwCent = {}, nwKeys = [], nwDrag = null, nwPin = null;
VIEWS.network = el => {
  el.innerHTML = head('Cross-linked', 'Connections \u2014 who sits where, and who they connect to',

    + `<div class="ctrls">
      <div class="ctrl"><span>Scope</span><div class="seg" id="nwScope">

  seg('#nwScope', () => { nwSel = null; nwPin = null; nwBuild(); });

  $('#nwClear').addEventListener('click', () => { nwSel = null; nwPin = null; nwBuild(); });
  const svg = $('#nwSvg');
  svg.addEventListener('mousemove', ev => {
    if (nwDrag) { const b = svg.getBoundingClientRect(); nwDrag.x = (ev.clientX - b.left) / b.width * NWW; nwDrag.y = (ev.clientY - b.top) / b.height * NWH; nwDrag.vx = nwDrag.vy = 0; nwRender(); return; }
    const c = ev.target.closest('circle[data-i]'), tip = $('#nwTip');
    if (!c) { tip.style.opacity = 0; return; }

    tip.style.opacity = 1; tip.style.left = Math.min(box.width - 300, ev.clientX - box.left + 14) + 'px'; tip.style.top = (ev.clientY - box.top + 14) + 'px';

  window.addEventListener('mouseup', () => { nwDrag = null; });
  svg.addEventListener('mouseleave', () => { $('#nwTip').style.opacity = 0; nwDrag = null; });
  svg.addEventListener('click', ev => {
    const c = ev.target.closest('circle[data-i]'); if (!c) return;
    openEntity(nwN[+c.dataset.i].e.id);
  });
  nwBuild();
};
REDRAW.network = () => nwRender();

const nwScope = () => segVal('#nwScope');
const nwColMode = () => segVal('#nwCols');
function nwPool() {
  const s = nwScope();
  return ENT.filter(e => s === 'all' ? true : s === 'person' ? e.kind === 'person' : e.kind !== 'person');
}
function nwColsOf(e) {
  if (nwColMode() === 'dom' && e.kind === 'person') return e.doms;
  const cats = new Set();
  e.k.forEach(t => { const rec = D.terms.find(x => x.t === t); if (rec) cats.add(rec.c); });
  return cats.size ? [...cats] : ['Unclassified'];
}
function nwRowsOf(e) { return e.kind === 'person' ? e.group : e.group; }

function nwBuild() {
  const pool = nwPool();
  pool.forEach(e => { e._cols = nwColsOf(e); });
  const rows = [...new Set(pool.map(nwRowsOf))].sort((a, b) => pool.filter(e => nwRowsOf(e) === b).length - pool.filter(e => nwRowsOf(e) === a).length);
  const colSet = {}; pool.forEach(e => e._cols.forEach(c => colSet[c] = (colSet[c] || 0) + 1));
  const cols = Object.keys(colSet).sort((a, b) => colSet[b] - colSet[a]);
  const M = {}; rows.forEach(r => { M[r] = {}; cols.forEach(c => M[r][c] = 0); });
  pool.forEach(e => e._cols.forEach(c => { if (M[nwRowsOf(e)]) M[nwRowsOf(e)][c]++; }));
  $('#nwHeat').innerHTML = heatTable(rows, cols, (r, c) => M[r][c], {
    label: (v) => v ? `<b>${v}</b>` : '',
    rowKey: r => `${esc(r)} <span style="color:var(--ink2);font-weight:400;font-family:var(--num);font-size:11px">${pool.filter(e => nwRowsOf(e) === r).length}</span>`,
    rowTotals: r => pool.filter(e => nwRowsOf(e) === r).length,
    colTotals: c => colSet[c],
    sel: nwSel ? (r, c) => nwSel[0] === r && nwSel[1] === c : null,
  });
  $('#nwHeat').onclick = ev => {
    const c = ev.target.closest('.cell[data-r]'); if (!c) return;
    const k = [c.dataset.r, c.dataset.c];
    nwSel = (nwSel && nwSel[0] === k[0] && nwSel[1] === k[1]) ? null : k;
    nwBuild();
  };
  /* cluster positioned by column group, colored by row group */
  nwKeys = cols;
  nwCent = cells(cols, NWW, NWH, 10);
  const prev = {}; if (nwN) nwN.forEach(n => prev[n.e.id] = n);
  nwN = pool.map((e, i) => {
    const p = prev[e.id];
    const home = e._cols[0];
    return {
      e, i, r: e.kind === 'person' ? 5.2 : 6.4,
      x: p ? p.x : NWW / 2 + (Math.random() - .5) * 240, y: p ? p.y : NWH / 2 + (Math.random() - .5) * 200,
      vx: 0, vy: 0, cx: (nwCent[home] || { x: NWW / 2 }).x, cy: (nwCent[home] || { y: NWH / 2 }).y
    };
  });
  const links = [];
  const byRow = {};
  nwN.forEach(n => (byRow[nwRowsOf(n.e)] = byRow[nwRowsOf(n.e)] || []).push(n));
  Object.values(byRow).forEach(g => { for (let i = 1; i < g.length; i++) links.push({ s: g[i - 1], t: g[i], w: .6, len: 34 }); });
  const sim = makeSim(nwN, links, NWW, NWH, { charge: -36, center: .075, collide: 2.1, damp: .83 });
  const PAL = rowPalette(rows);
  $('#nwKeys').innerHTML = rows.map(r => `<span class="key" style="cursor:default">
    <span class="sw" style="background:${PAL[r]}"></span>${esc(r)}
    <span style="font-family:var(--num);opacity:.65">${pool.filter(e => nwRowsOf(e) === r).length}</span></span>`).join('');
  nwPal = PAL;
  cancelAnimationFrame(nwRaf);
  let steps = 0;
  (function loop() { for (let i = 0; i < 2; i++) { sim.tick(); steps++; } nwRender(); if (steps < 700) nwRaf = requestAnimationFrame(loop); })();
  nwSide();
}
let nwPal = {};
function rowPalette(rows) {
  const base = ['#0B3B45', '#B4491F', '#17786F', '#D9A15C', '#5B8FA8', '#9C6B8E', '#6E7F5C', '#8C5A2B', '#2E9E8F', '#7FB0A0', '#B7BFBC'];
  const out = {}; rows.forEach((r, i) => out[r] = INST_COLOR[r] || base[i % base.length]);
  return out;
}
function nwMatch(n) {
  if (nwSel && !(nwRowsOf(n.e) === nwSel[0] && n.e._cols.includes(nwSel[1]))) return false;
  if (nwQ) return (n.e.name + ' ' + n.e.sub + ' ' + (n.e.focus || '') + ' ' + (n.e.desc || '')).toLowerCase().includes(nwQ.toLowerCase());
  return true;
}
function nwRender() {
  if (!nwN) return;
  const labels = nwKeys.map(k => {
    const c = nwCent[k]; if (!c) return '';
    const short = k.length > 22 ? k.slice(0, 21) + '\u2026' : k;
    const lx = Math.max(92, Math.min(NWW - 92, c.x));
    const on = !nwSel || nwSel[1] === k;
    return `<text x="${lx.toFixed(0)}" y="${c.top.toFixed(0)}" text-anchor="middle" opacity="${on ? 1 : .28}"
      font-family="Cambria,Georgia,serif" font-size="12" font-weight="700" fill="#4A6068">${esc(short)}</text>`;
  }).join('');
  const circ = nwN.map(n => {
    const on = nwMatch(n);
    return `<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r}" data-i="${n.i}"
      fill="${nwPal[nwRowsOf(n.e)] || '#B7BFBC'}" fill-opacity="${on ? .88 : .08}"
      stroke="${n.e.kind === 'person' ? '#fff' : '#0E2831'}" stroke-width="${n.e.kind === 'person' ? .7 : 1.1}"
      style="cursor:pointer"/>`;
  }).join('');
  $('#nwSvg').innerHTML = labels + circ;
}
function nwSide() {
  const el = $('#nwSide');
  if (!nwSel) {
    const pool = nwPool();
    const bridges = pool.filter(e => e.kind === 'person' && e.doms.length >= 4)
      .sort((a, b) => b.doms.length - a.doms.length).slice(0, 8);
    el.innerHTML = `<div class="kicker">Linked view</div><h3>${pool.length} records in scope</h3>
      <p style="font-size:12.5px;color:var(--ink2);margin:4px 0 12px">Click a heat-map cell to isolate a group, or any
      node for its profile. Every name in this atlas opens the same profile.</p>
      ${bridges.length ? `<p style="font-size:12.5px"><b>The bridging researchers</b><br>
        <span style="color:var(--ink2);font-size:12px">Recorded focus spanning four or more domains. These are the people
        worth putting in a room together, because they already speak more than one language.</span></p>
        <ul class="plist" style="max-height:none">${bridges.map(e => `<li data-ent="${e.id}" style="cursor:pointer">
          <b>${esc(e.name)}</b><span>${esc(e.group)} \u00b7 ${esc(e.sub)}</span>
          <span style="color:var(--teal);margin-top:2px">${e.doms.length} domains \u00b7 ${e.k.length} vocabulary terms</span></li>`).join('')}</ul>` : ''}`;
    return;
  }
  const [r, c] = nwSel;
  const list = nwPool().filter(e => nwRowsOf(e) === r && e._cols.includes(c));
  el.innerHTML = `<div class="kicker">${esc(r)} \u00b7 ${esc(c)}</div><h3>${list.length} record${list.length === 1 ? '' : 's'}</h3>
    <p style="font-size:12.5px;color:var(--ink2);margin:4px 0 8px">Isolated in the cluster map. Click any name for the full profile and its linked records.</p>
    ${list.length ? `<ul class="plist" style="max-height:520px">${list.map(e => `<li data-ent="${e.id}" style="cursor:pointer">
      <b>${esc(e.name)}</b><span>${esc(e.kind === 'person' ? e.sub : e.group + (e.sub ? ' \u00b7 ' + e.sub : ''))}</span>
      ${e.focus ? `<span style="color:var(--teal);margin-top:2px">${esc(String(e.focus).slice(0, 120))}</span>` : ''}
      <span style="font-family:var(--num);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;margin-top:4px">${esc(e.conf)}</span>
      </li>`).join('')}</ul>` : '<p class="empty">Nothing in this cell.</p>'}`;
}
/* =========================================================================
   16 · RELATIONSHIP NETWORK — a true cluster map. Positions are not assigned
   by attribute; they emerge from the links themselves, and the communities
   are detected from the link structure rather than declared.
   ========================================================================= */
const GW = 980, GH = 660;
const EDGE_STYLE = {
  inv:  { c: '#B4491F', w: 2.2, o: .95, label: 'Named inventorship', note: 'Read from the patent record. The only verified link type.' },
  dept: { c: '#0B3B45', w: 1.5, o: .55, label: 'Same department',    note: 'Shares a department in the directory.' },
  term: { c: '#17786F', w: 1.1, o: .40, label: 'Shared vocabulary',  note: 'Two or more controlled-vocabulary terms in common.' },
  dom:  { c: '#D9A15C', w: 1.0, o: .38, label: 'Same domain, different institution', note: 'The introductions the platform exists to make.' },
};
const COMM_COLORS = ['#0B3B45', '#B4491F', '#17786F', '#D9A15C', '#5B8FA8', '#9C6B8E', '#6E7F5C', '#8C5A2B',
                     '#2E9E8F', '#7FB0A0', '#C56B3E', '#4A6B8A', '#7A5C8E', '#A8863B', '#3F7A63', '#8A5250'];

let gN = null, gE = null, gAdj = null, gRaf = null, gSel = null, gQ = '', gDrag = null,
    gOff = new Set(), gColor = 'comm', gFocus = null, gSim = null;

VIEWS.graph = el => {
  const G = D.graph;
  el.innerHTML = head('Cross-linked', 'Relationship network',
    'A cluster map in the strict sense: nothing here is positioned by a category we assigned. Nodes find their place from the links between them, and the communities below were detected from that link structure rather than declared in advance. Hover a node to light up its neighbors, click for the full profile, or focus it to see only its neighborhood.')
    + nums([
      [G.nodes.length, 'records in the network'],
      [G.edges.length, 'links drawn'],
      [G.comm.length, 'communities detected'],
      [G.edges.filter(e => e[2] === 'inv').length, 'verified inventorship links'],
      [G.nodes.filter(n => n.c === -1).length, 'records with no community'],
    ])
    + `<div class="ctrls">
      <div class="ctrl"><span>Color by</span><div class="seg" id="gColor">
        <button data-v="comm" aria-pressed="true">Detected community</button>
        <button data-v="kind" aria-pressed="false">Record type</button>
        <button data-v="dom" aria-pressed="false">Domain</button></div></div>
      <div class="ctrl"><span>Find</span><input type="search" id="gSearch" placeholder="name, organization or patent"></div>
      <div class="ctrl"><button class="btn" id="gReheat">Re-settle</button>
        <button class="btn" id="gUnfocus" style="display:none">Clear focus</button></div>
    </div>
    <div class="ctrls" style="margin-top:-6px">
      <div class="ctrl"><span>Link types</span><div class="keys" id="gEdgeKeys" style="margin:0"></div></div>
    </div>
    <div class="split">
      <div><div class="plot" id="gPlot"><svg id="gSvg" viewBox="0 0 ${GW} ${GH}" preserveAspectRatio="xMidYMid meet"></svg><div class="tip" id="gTip"></div></div>
        <div class="keys" id="gKeys"></div></div>
      <div class="card side" id="gSide"></div>
    </div>`;

  gN = G.nodes.map((n, i) => ({
    ...n, i, deg: 0,
    r: 4.4, x: GW / 2 + (Math.random() - .5) * 420, y: GH / 2 + (Math.random() - .5) * 340, vx: 0, vy: 0
  }));
  gE = G.edges.map(([a, b, t, w]) => ({ a, b, t, w }));
  gAdj = gN.map(() => []);
  gE.forEach((e, i) => { gN[e.a].deg++; gN[e.b].deg++; gAdj[e.a].push([e.b, i]); gAdj[e.b].push([e.a, i]); });
  gN.forEach(n => n.r = 3.6 + Math.min(Math.sqrt(n.deg), 4.6) * 1.35);

  $('#gEdgeKeys').innerHTML = Object.entries(EDGE_STYLE).map(([k, s]) =>
    `<button class="key" data-e="${k}" aria-pressed="true" title="${esc(s.note)}">
      <span style="width:16px;height:0;border-top:${s.w + 1}px solid ${s.c};display:inline-block"></span>${esc(s.label)}
      <span style="font-family:var(--num);opacity:.65">${gE.filter(e => e.t === k).length}</span></button>`).join('');
  $('#gEdgeKeys').addEventListener('click', ev => {
    const b = ev.target.closest('.key'); if (!b) return;
    const k = b.dataset.e; gOff.has(k) ? gOff.delete(k) : gOff.add(k);
    b.setAttribute('aria-pressed', !gOff.has(k)); gRender();
  });
  seg('#gColor', v => { gColor = v; gKeysDraw(); gRender(); });
  $('#gSearch').addEventListener('input', ev => { gQ = ev.target.value.trim(); gRender(); });
  $('#gReheat').addEventListener('click', () => gLayout(true));
  $('#gUnfocus').addEventListener('click', () => { gFocus = null; $('#gUnfocus').style.display = 'none'; gLayout(true); });

  const svg = $('#gSvg');
  svg.addEventListener('mousemove', ev => {
    if (gDrag) { const b = svg.getBoundingClientRect(); gDrag.x = (ev.clientX - b.left) / b.width * GW; gDrag.y = (ev.clientY - b.top) / b.height * GH; gDrag.vx = gDrag.vy = 0; gRender(); return; }
    const c = ev.target.closest('circle[data-i]'), tip = $('#gTip');
    if (!c) { if (gSel !== null) { gSel = null; gRender(); } tip.style.opacity = 0; return; }
    const i = +c.dataset.i;
    if (gSel !== i) { gSel = i; gRender(); }
    const n = gN[i], box = $('#gPlot').getBoundingClientRect();
    tip.innerHTML = `<b>${esc(n.n)}</b><i>${esc(n.g)} \u00b7 ${n.deg} link${n.deg === 1 ? '' : 's'}</i><br>
      ${n.c >= 0 ? esc(D.graph.comm[n.c]) : 'no community'}<br><i>click for the profile \u00b7 shift-click to focus</i>`;
    tip.style.opacity = 1; tip.style.left = Math.min(box.width - 300, ev.clientX - box.left + 14) + 'px'; tip.style.top = (ev.clientY - box.top + 14) + 'px';
  });
  svg.addEventListener('mousedown', ev => { const c = ev.target.closest('circle[data-i]'); if (c && !ev.shiftKey) { gDrag = gN[+c.dataset.i]; ev.preventDefault(); } });
  window.addEventListener('mouseup', () => { gDrag = null; });
  svg.addEventListener('mouseleave', () => { $('#gTip').style.opacity = 0; gDrag = null; gSel = null; gRender(); });
  svg.addEventListener('click', ev => {
    const c = ev.target.closest('circle[data-i]'); if (!c) return;
    const n = gN[+c.dataset.i];
    if (ev.shiftKey) { gFocus = n.i; $('#gUnfocus').style.display = ''; gLayout(true); }
    else openEntity(n.id);
  });
  gKeysDraw(); gLayout(true);
};
REDRAW.graph = () => gRender();

function gColorOf(n) {
  if (gColor === 'kind') return KIND_COLOR[n.k];
  if (gColor === 'dom') return DOM_COLOR[n.d] || ST_COLOR[n.d] || '#B7BFBC';
  return n.c >= 0 ? COMM_COLORS[n.c % COMM_COLORS.length] : '#C3CBC8';
}
function gKeysDraw() {
  let items;
  if (gColor === 'comm') items = D.graph.comm.map((nm, i) => [nm, COMM_COLORS[i % COMM_COLORS.length], gN.filter(n => n.c === i).length]);
  else if (gColor === 'kind') items = Object.entries(KIND_COLOR).map(([k, c]) => [k === 'org' ? 'Organization' : k[0].toUpperCase() + k.slice(1), c, gN.filter(n => n.k === k).length]);
  else items = [...new Set(gN.map(n => n.d))].map(d => [d, DOM_COLOR[d] || ST_COLOR[d] || '#B7BFBC', gN.filter(n => n.d === d).length]).sort((a, b) => b[2] - a[2]).slice(0, 14);
  $('#gKeys').innerHTML = items.map(([nm, c, n]) => `<span class="key" style="cursor:default">
    <span class="sw" style="background:${c}"></span>${esc(nm)}
    <span style="font-family:var(--num);opacity:.65">${n}</span></span>`).join('');
}
function gVisible(i) {
  if (gFocus === null) return true;
  if (i === gFocus) return true;
  return gAdj[gFocus].some(([j]) => j === i);
}
function gLayout(reset) {
  const live = gE.filter(e => !gOff.has(e.t) && gVisible(e.a) && gVisible(e.b));
  if (reset) {
    const set = gN.filter(n => gVisible(n.i));
    set.forEach(n => { n.x = GW / 2 + (Math.random() - .5) * 400; n.y = GH / 2 + (Math.random() - .5) * 320; n.vx = n.vy = 0; n.cx = GW / 2; n.cy = GH / 2; });
  }
  const LEN = { inv: 20, dept: 30, term: 86, dom: 104 };
  const links = live.map(e => ({ s: gN[e.a], t: gN[e.b], w: e.w * (e.t === 'dom' ? .28 : e.t === 'term' ? .5 : 1), len: LEN[e.t] }));
  const nodes = gN.filter(n => gVisible(n.i));
  nodes.forEach(n => { n.cx = GW / 2; n.cy = GH / 2; });
  gSim = makeSim(nodes, links, GW, GH, { charge: -320, center: .009, collide: 2.0, damp: .88, link: .055 });
  cancelAnimationFrame(gRaf);
  let steps = 0;
  (function loop() { for (let i = 0; i < 3; i++) { gSim.tick(); steps++; } gRender(); if (steps < 1400) gRaf = requestAnimationFrame(loop); })();
  gSide();
}
function gRender() {
  if (!gN) return;
  const q = gQ.toLowerCase();
  const nb = new Set();
  if (gSel !== null) { nb.add(gSel); gAdj[gSel].forEach(([j]) => nb.add(j)); }
  const edges = gE.map((e, i) => {
    if (gOff.has(e.t) || !gVisible(e.a) || !gVisible(e.b)) return '';
    const s = EDGE_STYLE[e.t], A = gN[e.a], B = gN[e.b];
    const hot = gSel !== null && (e.a === gSel || e.b === gSel);
    const o = gSel !== null ? (hot ? .95 : .06) : s.o;
    return `<line x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}"
      stroke="${s.c}" stroke-opacity="${o}" stroke-width="${hot ? s.w + 1 : s.w}"/>`;
  }).join('');
  const circles = gN.map(n => {
    if (!gVisible(n.i)) return '';
    const match = !q || (n.n + ' ' + n.g + ' ' + n.d).toLowerCase().includes(q);
    const near = gSel === null || nb.has(n.i);
    const op = (match ? 1 : .08) * (near ? 1 : .12);
    const isSel = gSel === n.i || gFocus === n.i;
    return `<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${(isSel ? n.r + 2.5 : n.r).toFixed(1)}" data-i="${n.i}"
      fill="${gColorOf(n)}" fill-opacity="${(op * .92).toFixed(2)}"
      stroke="${isSel ? '#0E2831' : n.k === 'person' ? '#fff' : '#0E2831'}"
      stroke-opacity="${op.toFixed(2)}" stroke-width="${isSel ? 2.2 : n.k === 'person' ? .7 : 1.1}" style="cursor:pointer"/>`;
  }).join('');
  let label = '';
  if (gFocus !== null) {
    const n = gN[gFocus];
    label = `<text x="${n.x.toFixed(0)}" y="${(n.y - n.r - 9).toFixed(0)}" text-anchor="middle"
      font-family="Cambria,Georgia,serif" font-size="13" font-weight="700" fill="#0E2831">${esc(n.n)}</text>`;
  }
  $('#gSvg').innerHTML = edges + circles + label;
}
function gSide() {
  const el = $('#gSide');
  if (gFocus !== null) {
    const n = gN[gFocus];
    const groups = {};
    gAdj[gFocus].forEach(([j, ei]) => { const t = gE[ei].t; (groups[t] = groups[t] || []).push(gN[j]); });
    el.innerHTML = `<div class="kicker">Focused neighborhood</div><h3>${esc(n.n)}</h3>
      <p style="font-size:12.5px;color:var(--ink2);margin:3px 0 10px">${esc(n.g)} \u00b7 ${n.deg} link${n.deg === 1 ? '' : 's'}${n.c >= 0 ? ' \u00b7 ' + esc(D.graph.comm[n.c]) : ''}</p>
      <p><button class="btn" data-ent="${n.id}">Open full profile</button></p>
      ${Object.entries(groups).map(([t, list]) => `<div style="margin-top:16px">
        <p style="font-size:12.5px;margin:0 0 4px"><b><span style="display:inline-block;width:14px;height:0;border-top:3px solid ${EDGE_STYLE[t].c};vertical-align:middle;margin-right:7px"></span>${EDGE_STYLE[t].label}</b>
        <span style="font-family:var(--num);color:var(--ink3)">${list.length}</span></p>
        <ul class="plist" style="max-height:none;margin-top:4px">${list.slice(0, 20).map(x => `<li data-ent="${x.id}" style="cursor:pointer">
          <b>${esc(x.n)}</b><span>${esc(x.g)}${x.d && x.k === 'person' ? ' \u00b7 ' + esc(x.d) : ''}</span></li>`).join('')}</ul></div>`).join('')}`;
    return;
  }
  const comms = D.graph.comm.map((nm, i) => ({ nm, i, n: gN.filter(x => x.c === i).length }));
  const hubs = gN.slice().sort((a, b) => b.deg - a.deg).slice(0, 8);
  el.innerHTML = `<div class="kicker">Detected structure</div><h3>${D.graph.comm.length} communities</h3>
    <p style="font-size:12.5px;color:var(--ink2);margin:4px 0 10px">Found by label propagation over the links, not
    assigned. Where a name carries a department, the cluster sits inside one unit; where it does not, it spans several.</p>
    ${comms.map(c => `<div class="stat"><span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;
      background:${COMM_COLORS[c.i % COMM_COLORS.length]};margin-right:7px"></span>${esc(c.nm)}</span><b>${c.n}</b></div>`).join('')}
    <p style="font-size:12.5px;margin-top:16px"><b>The most connected records</b><br>
      <span style="color:var(--ink2);font-size:12px">Highest link count. These are the people and organizations the
      platform should route through, and the ones whose absence would fragment the network.</span></p>
    <ul class="plist" style="max-height:none">${hubs.map(n => `<li data-ent="${n.id}" style="cursor:pointer">
      <b>${esc(n.n)}</b><span>${esc(n.g)}</span>
      <span style="color:var(--teal);margin-top:2px">${n.deg} links${n.c >= 0 ? ' \u00b7 ' + esc(D.graph.comm[n.c]) : ''}</span></li>`).join('')}</ul>
    <p style="color:var(--ink2);font-size:12px;margin-top:14px">Shift-click any node to focus its neighborhood.</p>`;
}
go('overview');

</script>
</body>
</html>
